[net]
; Host: nearby vehicles' corrections every N ticks instead of the game's 5. A client shows a vehicle where the host had it
; N ticks earlier (on top of the network delay), so 1 shows them ~64 ms sooner, the driver's own vehicle too; farther
; vehicles 4 ticks sooner each. Costs upload (nearby moving vehicles corrected up to 5x as often). 5 = the game's.
; This is the fastest: when a player's send queue passes correction_queue_ms (the upload can't keep up, e.g. many
; vehicles nearby over a Steam relay), corrections slow down step by step to at most every correction_max_ticks, and
; speed up again once the queue stays empty.
correction_min_ticks=1
correction_max_ticks=10
correction_queue_ms=100
; Steam send buffer in KB (Steam default 512). Only matters on the host.
send_buffer_kb=8192
; Steam receive buffer in KB (Steam default 1024). Only matters on a client.
recv_buffer_kb=8192
; 1 = adaptive send rate: measures what each player actually receives and sends at that speed.
; Steam has no congestion control of its own: sending faster than a player's connection takes makes
; it resend nearly everything, so mod downloads and ship spawns crawl.
rate_control=1
; Adaptive rate: start, lowest and highest send rate in KB/s. A session starts at the higher of start_rate_kb and
; 0.75 x the capacity the last session measured (kept in status.ini, [rate] capacity_kb; at most 2048).
start_rate_kb=256
min_rate_kb=32
max_rate_kb=8192
; Fixed send rate in KB/s, only used with rate_control=0 (0 = Steam default, 256).
send_rate_kb=0
; Tick priority: vehicle data, mod files and other bulk messages wait in the game's own queue while Steam
; already holds more than this many ms of sending for that player, so game updates are never stuck behind
; them (0 = off: everything goes into Steam's queue at once, as before).
pace_ms=40
; Size of the pieces the game cuts messages into, in KB (game default 511; 0 = leave the game's). Small
; pieces let game updates slip in between. Works with players who don't have this mod.
piece_kb=16
; Network thread wait between loops in microseconds (0 = game's Sleep(1), which lasts 15.6 ms on most PCs).
net_loop_us=1000
; Steam's Nagle delay for event messages in microseconds (-1 = Steam default 5000).
nagle_us=0
; Largest UDP payload Steam sends, in bytes (0 = Steam's 1300). 1200 fits every path that carries IPv6's minimum
; packet (1280 with headers): over Tailscale bigger packets were all lost and joins timed out.
mtu_packet_size=1200
; Direct connections: allow a direct (ICE) route to every peer instead of only via Steam relays; the relay must
; be relay_penalty_ms better before Steam picks it. Both players need it for a direct route. Off by default: 2026-10-24
; it never formed (NAT traversal failed), and a direct path measured 229 ms against the relay's 216 ms anyway.
direct_connect=0
relay_penalty_ms=10
; Steam's own P2P / ICE messages in network_fixes.log ("steam:" lines), shows why a route stays relayed: 0 off, 1 on, 2 verbose.
ice_log=1
; STUN servers (host:port, comma-separated) Steam uses to find your public address for a direct route. Empty = Steam's own,
; which some networks can't reach (direct route then fails: "NAT traversal failed"). 2026-10-24: a custom list (Google +
; Cloudflare) found the public address but then Steam's STUN code looped (10000 sends per tick) and the join never
; connected, so this stays empty unless testing.
stun_servers=
; Redundant game updates (needs this mod on both ends): every small game update is also sent a second
; way that doesn't wait for lost packets to be resent, bundled with the two before it. A lost packet then
; costs 16 ms instead of a frozen game for a whole round trip. Players without the mod are unaffected.
redundancy=1
; Playout buffer (when you join someone): keeps just enough of the host's updates queued to cover the
; jitter measured on your connection and steers the game's speed a little (0.8x..1.5x) to stay there,
; instead of freezing when an update is late and then fast-forwarding. 1 = only while redundant updates
; arrive (without them it would add delay for little gain), 2 = always, 0 = game's own pacing (stats
; still logged), -1 = off completely.
playout=1
; Smallest queue it keeps, in game ticks (1 tick = 16 ms).
playout_min_ticks=1
; Largest delay it may add to cover jitter, in ms. 20 (= 1 tick) since 1.6.1, for the lowest delay: a late update then
; shows as a short freeze ("playout 10s" counts them); 150 covers jitter fully.
playout_max_ms=20
; 1 = when hosting, the world slows down just enough for the slowest client running this mod to keep up: clients
;     report how many ticks they are behind (beyond the small buffer playout keeps for jitter); above pacing_target_ticks the host lengthens its tick (up to
;     max_tick_ms), and returns to the game's 16 ms once they've caught up. A client that can't simulate as fast as
;     the host otherwise falls further behind for good (2026-10-22: +10 ticks/s, 5 fps catch-up). 0 = off (default:
;     a last resort, it slows the world for everyone).
host_pacing=0
; Host pacing also slows the world while a playing player's send queue (this PC's upload to them) is over this
; many ms: their updates are as late there as in their own queue. Vehicle corrections back off first (100 ms).
pacing_queue_ms=250
; 2: the game labels a player under 5 queued ticks "synced", under 10 "slow", from 10 "desynced" (the
;     playout buffer of 2-3 ticks comes on top of this), and every tick held back is 16+ ms of delay for them.
pacing_target_ticks=2
; Maximum tick period under normal pacing (33 ms = 30 ticks/s).
max_tick_ms=33
; Maximum tick period during severe catch-up (> 60 ticks behind: 40 ms = 25 ticks/s).
catchup_max_tick_ms=40
; Client with the full-screen map open: the game then simulates on the render thread, one
; catch-up round per frame, and falls behind. While more than 14 host ticks are queued, more rounds run in the same
; frame, up to this many ms (the map then draws at a lower frame rate until it has caught up). 0 = off.
map_catchup_ms=100
; Client with an editor / another foreground screen open: at most this many host ticks per frame, without extra
; catch-up calls. 1 keeps a backlog from forcing ten expensive world ticks into every editor frame. All updates
; remain queued; full catch-up resumes on exit. A single world tick / spawn can still stall a frame. 0 = old behavior.
editor_catchup_ticks=1
; Background vehicle-editor development: 0 off, 1 ownership audit only, 2 scheduling prototype (active worker).
; Prototype requires the exact audited game build, native async mode and a distinct preview game world.
; It REFUSES a shared live/preview world; those editors need scene isolation before concurrency can be enabled.
; Mode 2 enables background async replay when preview world is verified distinct, decoupling render freezes.
editor_background=2
[audit]
; 1 = log what each machine applies (tick events by type), every player character transform sent / received (rate,
;     speed, jumps, out-of-order "reverts"), seat / input requests, and a merge audit of the redundant copies
;     (order and byte checks). Log only. 0 = off.
enabled=0
[forecast]
; Measure how far your copy of the world drifts from the host's (when you join someone; first step of
; with the error between the host's vehicle corrections and your own vehicle positions. 1 = on, 0 = off.
measure=0
[push]
; Physics steps per second on a client while it walks and pushes (the game runs 60). Needs physics_fixes.
client_physics_hz=180
; 1 = other players' characters keep their walking velocity on the host (vanilla zeroes it every tick). With
;     physics_fixes' [puppets] host_cull on they no longer touch movable bodies on the host, so clients push through
;     object push below instead. 0 = off.
remote_push=1
; Object push: includes dynamic scenery props and complete small vehicle assemblies.
; A client simulates the loose objects (objects=1) and small vehicles (vehicles=1) its own character
; pushes, and the host follows. Needs this mod and physics_fixes on both PCs. "object push" lines.
objects=1
vehicles=1
; 0 = a unit joined to bodies outside it (a bench's wheels) isn't taken over: those bodies keep following the host's
;     late states and the joints fling it. 1 = taken over anyway (as before 1.9.2).
outside_joints=0
; 1 = on the host, other players' characters move smoothly between the poses their game sends (shown about one
;     update interval, at most 250 ms, in the past). Vanilla puts them on the newest pose every tick, so under load
;     they freeze and jump. 0 = off.
smooth=1
[mp]
; 1 = timing lines for stress tests, both ends (cheap: two clock reads per part of a tick): "mp host 5s" / "mp client 5s"
log=1
stall_ms=250
; 1 = "net channels 5s": per player and channel, messages and KB each way, and gaps between the host's updates.
channels=1

; Joining player: "CATCHING UP..." in red at the top of the screen while more than banner_ticks host ticks
; are queued (hidden again at 14). 0 = off.
catchup_banner=1
banner_ticks=30
; Joining player: when this many host ticks are queued (30 = the player list's "desynced"), "behind:" lines dump
; the last 3 s of catch-up calls in 250 ms steps, and sum the episode up when it ends. At most one per 30 s.
behind_ticks=30

[measure]
; Log only. Host: what each player is sent per tick, by message type, and how many vehicle corrections repeat a pose
; already sent ("tick bytes 5s" lines).
tick_bytes=1
; Every 32nd channel-0 message compressed at two levels to see how much it would shrink ("tick compress 5s").
tick_compress=1

[touch]
; 1 = when you join someone: about 8 times a second, the bodies your character touches are listed for
; object push, which logs any it can't push (to find out what they are). Log only. 0 = off.
census=1
